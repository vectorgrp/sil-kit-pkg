name: "Build Images"

# Builds the packaging containers in containers/ and pushes them to
# ghcr.io/vectorgrp/sil-kit-pkg/<name>. Pull requests only build.
# Every architecture is built natively on its own runner and pushed as
# :sha-<short>-<arch>. The manifest job then combines the architectures of an
# image into one multi-arch :main / :sha-<short>, so release/packages.json can
# use the same reference on x86_64 and arm64 runners.
# release/packages.json pins the images by digest; the digest of each
# multi-arch image is written to the job summary.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/build-images.yml"
  push:
    branches: [main]
    paths:
      - "containers/**"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-2004, arch: amd64, runs_on: ubuntu-latest }
          - { name: ubuntu-2204, arch: arm64, runs_on: ubuntu-22.04-arm }
          - { name: centos-7, arch: amd64, runs_on: ubuntu-latest }
          - { name: alma-8, arch: amd64, runs_on: ubuntu-latest }
          - { name: alma-8, arch: arm64, runs_on: ubuntu-22.04-arm }
          - { name: fedora-40, arch: amd64, runs_on: ubuntu-latest }
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,suffix=-${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.name }}
          build-contexts: |
            utils=containers/utils
          platforms: linux/${{ matrix.arch }}
          provenance: false
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        if: matrix.name != 'fedora-40'
        run: |
          ref="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          [ "$PUSH" = "true" ] || ref="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$ref" sh -c 'uname -m && cmake --version && ninja --version && ${CXX:-g++} --version && python3 --version'

  manifest:
    name: ${{ matrix.name }} (manifest)
    needs: image
    # Runs also when another image failed; an image whose own builds failed
    # fails here because its :sha-<short>-<arch> tag is missing.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-2004, archs: amd64 }
          - { name: ubuntu-2204, archs: arm64 }
          - { name: centos-7, archs: amd64 }
          - { name: alma-8, archs: amd64 arm64 }
          - { name: fedora-40, archs: amd64 }
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
      ARCHS: ${{ matrix.archs }}

    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          tags="-t $IMAGE:$sha_tag"
          [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] && tags="$tags -t $IMAGE:main"
          sources=""
          for arch in $ARCHS; do sources="$sources $IMAGE:$sha_tag-$arch"; done
          docker buildx imagetools create $tags $sources
          digest="$(docker buildx imagetools inspect "$IMAGE:$sha_tag" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "\`$IMAGE@$digest\` ($ARCHS)" >> "$GITHUB_STEP_SUMMARY"
