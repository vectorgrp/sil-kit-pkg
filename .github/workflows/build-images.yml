name: "Build Images"

# Builds the packaging containers in containers/ and pushes them to
# ghcr.io/vectorgrp/sil-kit-pkg/<name>. Pull requests only build.
# release/packages.json pins the images by digest; the digest of each push is
# written to the job summary.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/build-images.yml"
  push:
    branches: [main]
    paths:
      - "containers/**"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-2004, runs_on: ubuntu-latest }
          - { name: ubuntu-2204, runs_on: ubuntu-22.04-arm }
          - { name: centos-7, runs_on: ubuntu-latest }
          - { name: alma-8, runs_on: ubuntu-latest }
          - { name: fedora-40, runs_on: ubuntu-latest }
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.name }}
          build-contexts: |
            utils=containers/utils
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        if: matrix.name != 'fedora-40'
        run: |
          ref="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          [ "$PUSH" = "true" ] || ref="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$ref" sh -c 'cmake --version && ninja --version && ${CXX:-g++} --version && python3 --version'

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "\`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
