name: "SilKit Packaging Workflow"
run-name: "package ${{ inputs.silkit_ref }} ${{ inputs.correlation_id }}"

# Builds every target in release/packages.json from a pinned sil-kit ref, tests each
# package in a plain distribution container and publishes everything as the artifact
# "sil-kit-pkg" (packages, pkg-manifest.json, SHA256).
#
# Started manually, or by sil-kit-delivery (pr.yaml) with
#   gh workflow run package-silkit.yml --ref <sil-kit-pkg branch/tag> -f silkit_ref=<sha> ...
# Releases are created by sil-kit-delivery promote.yaml from this artifact.

on:
  workflow_dispatch:
    inputs:
      silkit_ref:
        description: "sil-kit commit SHA or tag (vectorgrp/sil-kit)"
        required: true
        type: string
      pkg_sha:
        description: "Expected sil-kit-pkg commit; the run fails if the dispatched ref is at another commit"
        required: false
        type: string
      expected_version:
        description: "Expected SIL Kit version (major.minor.patch); fails if changelog, spec or sources disagree"
        required: false
        type: string
      correlation_id:
        description: "Free text shown in the run name, e.g. the triggering delivery run"
        required: false
        type: string
      debian_fullname:
        description: "Maintainer name for the Debian build (default: Maintainer in debian/control)"
        required: false
        type: string
      debian_email:
        description: "Maintainer email for the Debian build (default: Maintainer in debian/control)"
        required: false
        type: string
  workflow_call:
    inputs:
      silkit_ref: { required: true, type: string }
      pkg_sha: { required: false, type: string }
      expected_version: { required: false, type: string }
      correlation_id: { required: false, type: string }
      debian_fullname: { required: false, type: string }
      debian_email: { required: false, type: string }
      artifact_suffix:
        description: "Appended to all artifact names, so the workflow can run twice in one run"
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  PKG_WORKDIR: _i
  PKG_OUTDIR: _o
  ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}

jobs:

  targets:
    name: Targets and version
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      suffix: ${{ steps.version.outputs.suffix }}
      version: ${{ steps.version.outputs.version }}
      silkit_sha: ${{ steps.silkit.outputs.sha }}
      silkit_submodules: ${{ steps.silkit.outputs.submodules }}
      source_date_epoch: ${{ steps.silkit.outputs.source_date_epoch }}
    steps:
      - name: Check sil-kit-pkg commit
        if: inputs.pkg_sha != ''
        run: |
          if [ "${{ inputs.pkg_sha }}" != "${{ github.sha }}" ]; then
            echo "::error::dispatched ref is at ${{ github.sha }}, expected ${{ inputs.pkg_sha }}"
            exit 1
          fi

      - name: Checkout (sil-kit-pkg)
        uses: actions/checkout@v6
        with:
          path: sil-kit-pkg

      - name: Checkout (sil-kit)
        uses: actions/checkout@v6
        with:
          repository: vectorgrp/sil-kit
          ref: ${{ inputs.silkit_ref }}
          path: sil-kit

      - name: sil-kit commit
        id: silkit
        working-directory: sil-kit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          # top-level submodule commits as recorded in the sil-kit tree
          echo "submodules=$(git ls-tree -r HEAD | awk '$2 == "commit" { print $4 "\t" $3 }' \
            | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add // {}')" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: |
          python3 sil-kit-pkg/scripts/check_version.py \
            --pkg-dir sil-kit-pkg \
            --silkit-dir sil-kit \
            --expected-version "${{ inputs.expected_version }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Matrix
        id: matrix
        run: |
          echo "matrix=$(jq -c '{include: [.targets[] | .debuild_args = (.debuild_args // [])]}' sil-kit-pkg/release/packages.json)" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.id }}
    needs: targets
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout (sil-kit-pkg)
        uses: actions/checkout@v6
        with:
          path: sil-kit-pkg

      - name: Checkout (sil-kit)
        uses: actions/checkout@v6
        with:
          repository: vectorgrp/sil-kit
          ref: ${{ needs.targets.outputs.silkit_sha }}
          submodules: recursive
          path: sil-kit

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        id: image
        run: |
          docker pull "${{ matrix.image }}"
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ matrix.image }}")" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          TARGET: ${{ toJson(matrix) }}
          SOURCE_DATE_EPOCH: ${{ needs.targets.outputs.source_date_epoch }}
          DEBFULLNAME: ${{ inputs.debian_fullname }}
          DEBEMAIL: ${{ inputs.debian_email }}
        run: |
          maintainer="$(sed -n 's/^Maintainer: //p' sil-kit-pkg/debian/control)"
          export DEBFULLNAME="${DEBFULLNAME:-${maintainer% <*}}"
          export DEBEMAIL="${DEBEMAIL:-$(echo "$maintainer" | sed 's/.*<\(.*\)>.*/\1/')}"

          mkdir -p "$PKG_WORKDIR" "$PKG_OUTDIR"
          jq -n \
            --argjson target "$TARGET" \
            --arg major "${{ needs.targets.outputs.major }}" \
            --arg minor "${{ needs.targets.outputs.minor }}" \
            --arg patch "${{ needs.targets.outputs.patch }}" \
            --arg suffix "${{ needs.targets.outputs.suffix }}" \
            --arg work "$PKG_WORKDIR" --arg out "$PKG_OUTDIR" '{
              SilKitInfo: { url: "sil-kit", ref: "", recursive: true, is_local: true },
              package_repo_path: "sil-kit-pkg",
              version: { major: $major, minor: $minor, patch: $patch, suffix: $suffix },
              pkgformat: $target.pkgformat,
              platform: $target.platform,
              work_dir: $work,
              keep_temp: true,
              output_dir: $out,
              debuild: { args: $target.debuild_args }
            }' > "$PKG_WORKDIR/build_cfg.json"
          cat "$PKG_WORKDIR/build_cfg.json"

          # docker run instead of a job container: the GitHub actions (node 20)
          # do not run inside the CentOS 7 image
          docker run --rm ${{ matrix.container_options }} \
            -v "$PWD:/w" -w /w \
            -e SOURCE_DATE_EPOCH -e DEBFULLNAME -e DEBEMAIL -e CI_RUN=1 \
            "${{ matrix.image }}" \
            bash -c '
              set -e
              if [ "${{ matrix.pkgformat }}" = rpm ]; then usermod -a -G mock root; fi
              python3 sil-kit-pkg/scripts/silkit_linux_packaging.py --build-cfg "$0/build_cfg.json" --verbose
            ' "$PKG_WORKDIR"

      - name: Select assets
        env:
          TARGET: ${{ toJson(matrix) }}
        run: |
          python3 sil-kit-pkg/scripts/collect_packages.py select \
            --target "$TARGET" \
            --source "$PKG_OUTDIR" \
            --dest "dist/${{ matrix.id }}" \
            --image-digest "${{ steps.image.outputs.digest }}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.id }}${{ env.ARTIFACT_SUFFIX }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test ${{ matrix.id }}
    needs: [targets, package]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout (sil-kit-pkg)
        uses: actions/checkout@v6
        with:
          path: sil-kit-pkg

      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.id }}${{ env.ARTIFACT_SUFFIX }}
          path: dist

      - name: Test in ${{ matrix.test_image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.test_image }}" \
            sh sil-kit-pkg/tests/run_package_test.sh "${{ matrix.pkgformat }}" "/w/dist/${{ matrix.id }}"

  collect:
    name: Collect
    needs: [targets, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sil-kit-pkg)
        uses: actions/checkout@v6
        with:
          path: sil-kit-pkg

      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*${{ env.ARTIFACT_SUFFIX }}
          path: targets
          merge-multiple: true

      - name: Manifest
        run: |
          python3 sil-kit-pkg/scripts/collect_packages.py manifest \
            --source targets \
            --dest sil-kit-pkg-out \
            --version "${{ needs.targets.outputs.version }}" \
            --silkit-ref "${{ inputs.silkit_ref }}" \
            --silkit-sha "${{ needs.targets.outputs.silkit_sha }}" \
            --silkit-submodules '${{ needs.targets.outputs.silkit_submodules }}' \
            --pkg-sha "${{ github.sha }}" \
            --source-date-epoch "${{ needs.targets.outputs.source_date_epoch }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sil-kit-pkg${{ env.ARTIFACT_SUFFIX }}
          path: sil-kit-pkg-out/
          if-no-files-found: error
          retention-days: 30
